[project]
name = "translation-store"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth[socialaccount]>=65.0",
    "dj-database-url>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "vercel>=0.11.6",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "responses>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "store.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["postgres: needs a real PostgreSQL for row-lock behaviour (skipped on SQLite)"]

[tool.vercel.scripts]
# Runs on every Vercel build (DATABASE_URL comes from the Neon integration).
build = "python manage.py migrate --noinput"

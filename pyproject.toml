[project]
name = "translation-store"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth[socialaccount]>=65.0",
    "dj-database-url>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "responses>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "store.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
